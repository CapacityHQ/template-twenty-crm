# Capacity spike 2b — Coolify-ready variant of packages/twenty-docker/docker-compose.yml.
# Differences from upstream:
#   - `db` service REMOVED: Postgres runs as a standalone Coolify database resource
#     (API-managed dump backups; per-resource logs). PG_* envs point at it.
#   - server/worker use the Capacity fork image from ghcr, parameterized via
#     CAPACITY_IMAGE_REPO (set by the desktop app's deploy orchestrator to the
#     forked repo's own owner/repo); built by the generated
#     .github/workflows/capacity-build.yml.
#   - Redis stays in-compose (ephemeral, no backup need).
name: twenty

services:
  server:
    image: ghcr.io/${CAPACITY_IMAGE_REPO}:${TAG:-latest}
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
    ports:
      - "3000:3000"
    environment:
      NODE_PORT: 3000
      PG_DATABASE_URL: ${PG_DATABASE_URL}
      SERVER_URL: ${SERVER_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      DISABLE_DB_MIGRATIONS: ${DISABLE_DB_MIGRATIONS:-false}
      DISABLE_CRON_JOBS_REGISTRATION: ${DISABLE_CRON_JOBS_REGISTRATION:-false}
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      APP_SECRET: ${APP_SECRET}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: curl --fail http://localhost:3000/healthz
      interval: 5s
      timeout: 5s
      retries: 20
      # Twenty's first boot runs migrations + metadata sync for several minutes;
      # without a start_period the 100s check budget kills the deploy.
      start_period: 360s
    restart: always

  worker:
    image: ghcr.io/${CAPACITY_IMAGE_REPO}:${TAG:-latest}
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
    command: ["yarn", "worker:prod"]
    environment:
      PG_DATABASE_URL: ${PG_DATABASE_URL}
      SERVER_URL: ${SERVER_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      DISABLE_DB_MIGRATIONS: "true" # already run by the server
      DISABLE_CRON_JOBS_REGISTRATION: "true" # already run by the server
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      APP_SECRET: ${APP_SECRET}
    depends_on:
      server:
        condition: service_healthy
    restart: always

  redis:
    image: redis
    restart: always
    command: ["--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  server-local-data:
